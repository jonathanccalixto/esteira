# A esteira roda no Linux e no macOS. Este workflow confere os dois, mas só quando alguém manda
# (Actions > portabilidade > Run workflow): a fila de runners do macOS sozinha leva minutos.
name: portabilidade

on:
  workflow_dispatch:
    inputs:
      sistemas:
        description: "Em quais sistemas (macOS espera fila de runner: minutos)"
        type: choice
        options: ["linux e macos", "linux", "macos"]
        default: "linux e macos"
      video:
        description: "Incluir o teste do vídeo do QA (mais lento: instala ffmpeg, sobe o Chrome)"
        type: boolean
        default: true

jobs:
  pipeline:
    name: pipeline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.sistemas == 'linux' && '["ubuntu-latest"]' || inputs.sistemas == 'macos' && '["macos-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: sintaxe (no macOS, com o bash 3.2 do sistema)
        run: |
          for f in install.sh $(find skills tests -name '*.sh'); do /bin/bash -n "$f"; done
          for f in $(find skills -name '*.py'); do python3 -m py_compile "$f"; done
          for f in $(find skills -name '*.js'); do node --check "$f"; done
      - name: fumaça do pipeline
        run: /bin/bash tests/portabilidade.sh

  video:
    name: vídeo do QA (${{ matrix.os }})
    if: ${{ inputs.video }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.sistemas == 'linux' && '["ubuntu-latest"]' || inputs.sistemas == 'macos' && '["macos-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ferramentas (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ffmpeg xserver-xephyr x11-utils xdotool xvfb xauth
      - name: ferramentas (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: aquecer o Chrome (Linux)
        if: runner.os == 'Linux'
        run: |
          fc-cache -f > /dev/null
          timeout 120 google-chrome --headless=new --no-first-run --user-data-dir="$(mktemp -d)" --dump-dom about:blank > /dev/null
      - name: tomada (Linux, Xephyr dentro do xvfb-run)
        if: runner.os == 'Linux'
        run: xvfb-run -a bash tests/video.sh
      - name: tomada (macOS, Chrome headless)
        if: runner.os == 'macOS'
        run: /bin/bash tests/video.sh
