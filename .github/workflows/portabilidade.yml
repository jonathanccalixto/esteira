# A esteira roda no Linux e no macOS: cada push confere os dois.
name: portabilidade

on:
  push:
  pull_request:

jobs:
  pipeline:
    name: pipeline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: sintaxe (no macOS, com o bash 3.2 do sistema)
        run: |
          for f in install.sh $(find skills tests -name '*.sh'); do /bin/bash -n "$f"; done
          for f in $(find skills -name '*.py'); do python3 -m py_compile "$f"; done
          for f in $(find skills -name '*.js'); do node --check "$f"; done
      - name: fumaça do pipeline
        run: /bin/bash tests/portabilidade.sh

  video:
    name: vídeo do QA (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ferramentas (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg xserver-xephyr x11-utils xdotool xvfb
      - name: ferramentas (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: tomada (Linux, Xephyr dentro do xvfb-run)
        if: runner.os == 'Linux'
        run: xvfb-run -a bash tests/video.sh
      - name: tomada (macOS, Chrome headless)
        if: runner.os == 'macOS'
        run: /bin/bash tests/video.sh
